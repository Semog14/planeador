<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planeador de Refeições</title>
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top"><div class="brand">Planeador</div><nav id="who" aria-label="Pessoa"></nav><span id="sync" class="sync" title="Estado da sincronização"></span></header>
<main id="view" tabindex="-1"></main>
<nav id="tabs" aria-label="Secções">
  <button data-tab="hoje"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Hoje</span></button>
  <button data-tab="semana"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Semana</span></button>
  <button data-tab="compras"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span>Compras</span></button>
  <button data-tab="receitas"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5M9 8h6"/></svg><span>Receitas</span></button>
  <button data-tab="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Perfil</span></button>
</nav>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><button class="close" id="mclose" aria-label="Fechar">✕</button><div id="mbody"></div></div></div>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
